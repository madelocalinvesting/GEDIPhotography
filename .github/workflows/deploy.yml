name: Deploy to GitHub Pages
on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # We are turning OFF the cache to stop the "path not resolved" errors
          
      - name: Install dependencies
        # Force npm to go inside the folder and install
        run: npm install --prefix lovable-frontend

      - name: Build
        # Force npm to go inside the folder and build
        run: npm run build --prefix lovable-frontend

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Pointing to exactly where the website files end up
          path: './lovable-frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
